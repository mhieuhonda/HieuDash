# =============================================================================
#  Hieu Dash v0.6 - iOS / macOS project spec for xcodegen.
#
#  Run `xcodegen generate` in this directory to produce HieuDash.xcodeproj.
#  The generated project is unsigned (CODE_SIGNING_ALLOWED=NO) so it can be
#  built on the GitHub Actions macOS runner without a paid Apple Developer
#  account. The resulting .app is packaged as an .ipa for sideloading.
# =============================================================================
name: HieuDash
options:
  bundleIdPrefix: com.hieuhonda
  deploymentTarget:
    iOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    GCC_WARN_ABOUT_DEPRECATED_DECLARATIONS: NO
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    # cocos2d-x 2.2.3 was written before ARC; its .mm files use manual
    # retain/release. Force ARC off or every [obj release] / [super dealloc]
    # line fails to compile under modern Xcode (which defaults to ARC=YES).
    CLANG_ENABLE_OBJC_ARC: NO
    CLANG_ENABLE_MODULES: YES
    COCOS2DX_VERSION_MAJOR: 2
    COCOS2DX_VERSION_MINOR: 2
    COCOS2DX_VERSION_PATCH: 3
    OTHER_CFLAGS: "-fpermissive -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function -Wno-unused-parameter -Wno-sign-compare -Wno-switch -Wno-format -Wno-multichar -Wno-delete-incomplete -Wno-narrowing -Wno-error=objc-method-signatures -Wno-error=objc-protocol-property-synthesis"
    OTHER_CPLUSPLUSFLAGS: "-fpermissive -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function -Wno-unused-parameter -Wno-sign-compare -Wno-switch -Wno-format -Wno-multichar -Wno-delete-incomplete -Wno-narrowing -std=c++14 -stdlib=libc++"

targets:
  HieuDash-ios:
    type: application
    platform: iOS
    deploymentTarget: "11.0"
    sources:
      - path: ../Classes
      - path: ios
      # v0.7 CRITICAL FIX: bundle the entire Resources/ tree (sprite sheets,
      # .fnt fonts, .mp3 music, .plist animations) into the .app's main
      # bundle. Without this the iOS .ipa ships only executable code and
      # crashes on launch when AppDelegate tries to load GJ_GameSheet.plist.
      # We add Resources as a folder reference (type: folder -> the blue
      # folder in Xcode) so xcodegen creates a single "Copy Bundle
      # Resources" entry that copies every file recursively while
      # preserving the on-disk directory structure (so CCFileUtils iOS
      # finds "GJ_GameSheet.plist" at the bundle root, just like the
      # Android assets/ folder and the Linux/Windows Resources/ folder).
      - path: ../Resources
        type: folder
      - path: ../cocos2d/cocos2dx
        excludes:
          - "platform/android/**"
          - "platform/win32/**"
          - "platform/linux/**"
          - "platform/blackberry/**"
          - "platform/emscripten/**"
          - "platform/marmalade/**"
          - "platform/nacl/**"
          - "platform/tizen/**"
          - "platform/mac/**"
          - "proj.*/**"
          # CCImageCommonWebp.cpp pulls in <webp/decode.h> and links against
          # the libwebp prebuilt .a in cocos2dx/platform/third_party/ios/.
          # That .a was stripped from the GitHub source archive of cocos2d-x
          # 2.2.3 (only a `*.REMOVED.git-id` placeholder remains), so the
          # iOS link would fail with "no such file: libwebp.a". iOS uses
          # UIImage/CGImage for texture loading instead (see
          # cocos2dx/platform/ios/CCImage.mm), so WebP support is not needed.
          - "platform/CCImageCommonWebp.cpp"
      - path: ../cocos2d/CocosDenshion
        excludes:
          - "android/**"
          - "win32/**"
          - "linux/**"
          - "blackberry/**"
          - "emscripten/**"
          - "marmalade/**"
          - "nacl/**"
          - "tizen/**"
          - "mac/**"
          - "proj.*/**"
      - path: ../cocos2d/extensions
        excludes:
          - "proj.*/**"
          - "network/WebSocket.cpp"
          - "network/WebSocket.h"
          # HttpClient.cpp includes <curl/curl.h> and links against the
          # libcurl prebuilt .a in cocos2dx/platform/third_party/ios/.
          # That .a was stripped from the GitHub source archive of cocos2d-x
          # 2.2.3, so the iOS link would fail. Hieu Dash does not call
          # CCHttpClient directly (only CCHttpResponse is used as a type
          # for an unused parameter in GameToolbox::getResponse), so it is
          # safe to drop the implementation entirely.
          - "network/HttpClient.cpp"
          - "physics_nodes/CCPhysicsSprite.cpp"
          - "physics_nodes/CCPhysicsSprite.h"
          - "AssetsManager/**"
          - "GUI/CCEditBox/CCEditBoxImplWp8.cpp"
          - "GUI/CCEditBox/CCEditBoxImplWp8.h"
          - "GUI/CCEditBox/CCEditBoxImplWin.cpp"
          - "GUI/CCEditBox/CCEditBoxImplWin.h"
          - "GUI/CCEditBox/CCEditBoxImplAndroid.cpp"
          - "GUI/CCEditBox/CCEditBoxImplAndroid.h"
          - "GUI/CCEditBox/CCEditBoxImplTizen.cpp"
          - "GUI/CCEditBox/CCEditBoxImplTizen.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieuhonda.HieuDash
        PRODUCT_NAME: HieuDash
        INFOPLIST_FILE: ios/Info.plist
        # The repo does not ship an Asset Catalog, so we MUST NOT set
        # ASSETCATALOG_COMPILER_APPICON_NAME to AppIcon - Xcode 14+ treats
        # the missing catalog as a build error otherwise.
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "11.0"
        ENABLE_BITCODE: NO
        # Disable code signing on the build-bot. The CI runner has no
        # Apple Developer cert; we ship an unsigned .ipa for sideloading.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "COCOS2DX_VERSION_MAJOR=2"
          - "COCOS2DX_VERSION_MINOR=2"
          - "COCOS2DX_VERSION_PATCH=3"
          - "CC_TARGET_PLATFORM=CC_PLATFORM_IOS"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../cocos2d"
          - "$(SRCROOT)/../cocos2d/cocos2dx"
          - "$(SRCROOT)/../cocos2d/cocos2dx/include"
          - "$(SRCROOT)/../cocos2d/cocos2dx/kazmath/include"
          - "$(SRCROOT)/../cocos2d/cocos2dx/platform"
          - "$(SRCROOT)/../cocos2d/cocos2dx/platform/ios"
          - "$(SRCROOT)/../cocos2d/CocosDenshion/include"
          - "$(SRCROOT)/../cocos2d/extensions"
          - "$(SRCROOT)/../cocos2d/extensions/CCBReader"
          - "$(SRCROOT)/../cocos2d/extensions/GUI/CCControlExtension"
          - "$(SRCROOT)/../cocos2d/extensions/GUI/CCScrollView"
          - "$(SRCROOT)/../cocos2d/extensions/GUI/CCEditBox"
          - "$(SRCROOT)/../cocos2d/extensions/network"
          - "$(SRCROOT)/../cocos2d/extensions/physics_nodes"
          - "$(SRCROOT)/../cocos2d/extensions/spine"
          - "$(SRCROOT)/../Classes"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "OpenGLES"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "OpenAL"
          - "-lz"
    info:
      path: ios/Info.plist
      properties:
        CFBundleName: HieuDash
        CFBundleDisplayName: Hieu Dash
        CFBundleIdentifier: com.hieuhonda.HieuDash
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.7"
        CFBundlePackageType: APPL
        CFBundleExecutable: HieuDash
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
