# =============================================================================
#  Hieu Dash v0.7 - Multi-platform build pipeline (Cocos2d-x 2.2.3).
#
#  Triggers automatically when a NEW RELEASE is published, OR manually via
#  workflow_dispatch. Builds four platform artifacts in parallel:
#
#    - APK     -> ubuntu-latest    (NDK r10e + Ant 1.9.x, ships prebuilt libgame.so)
#    - iOS     -> macos-13          (xcodegen + xcodebuild, unsigned .ipa)
#    - Windows -> windows-2022    (CMake + MSVC v143 + vcpkg, .zip)
#    - Linux   -> ubuntu-latest     (CMake + gcc + apt, .tar.gz)
#
#  All four jobs hard-fail if their binary build fails - no source-tarball
#  fallback. The release is uploaded only when every platform produces a
#  real binary artifact.
# =============================================================================
name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload artifacts to (must already exist as a release)'
        required: true
        default: 'v0.7'

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  COCOS_VERSION: cocos2d-x-2.2.3
  COCOS_ZIP_URL: https://github.com/cocos2d/cocos2d-x/archive/refs/tags/cocos2d-x-2.2.3.zip
  COCOS_DIR_NAME: cocos2d-x-cocos2d-x-2.2.3
  HIUE_DASH_VERSION: "0.7"

jobs:
  prepare:
    name: Prepare (tag metadata)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      upload_url: ${{ steps.meta.outputs.upload_url }}
    steps:
      - name: Resolve release tag + upload URL
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" -R "${{ github.repository }}" --json url,uploadUrl -q '.uploadUrl' > upload_url.txt || true
          if [ -s upload_url.txt ]; then
            URL=$(cat upload_url.txt)
          else
            URL=""
          fi
          echo "upload_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  #  Android APK build.
  #
  #  Strategy: ship the prebuilt lib/armeabi/libgame.so (the original ELF
  #  from Geometry Dash 1.0) inside the APK. This avoids the REMOVED-binary
  #  problem in the cocos2d-x 2.2.3 GitHub archive (all prebuilt .a files
  #  for libjpeg/libpng/libtiff/libwebp are stripped, so ndk-build cannot
  #  link libgame.so from source).
  # ===========================================================================
  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ant openjdk-8-jdk openjdk-17-jdk

      - name: Setup Java 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (API 21 + build-tools 25.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-21 build-tools;25.0.0'

      - name: Install legacy Android SDK tools (for Ant build template)
        run: |
          # Modern Android SDK (cmdline-tools) no longer ships the
          # tools/ant/build.xml template that the cocos2d-x 2.2.3 build.xml
          # imports. We download the legacy standalone tools package
          # (tools_r25.2.3) and overlay it onto the SDK directory so the
          # Ant build can find tools/ant/build.xml + aapt + dx + apkbuilder.
          cd $HOME
          wget -q https://dl.google.com/android/repository/tools_r25.2.3-linux.zip
          unzip -q -o tools_r25.2.3-linux.zip -d $ANDROID_HOME/
          # Verify the ant build template now exists.
          test -f $ANDROID_HOME/tools/ant/build.xml
          ls $ANDROID_HOME/tools/ant/build.xml
          # Also verify aapt and dx are present.
          ls $ANDROID_HOME/build-tools/25.0.0/aapt
          ls $ANDROID_HOME/build-tools/25.0.0/dx
          # The runner's preinstalled SDK ships newer build-tools (37.0.0
          # etc.) which replaced the legacy 'dx' tool with 'd8'. The Ant
          # template from tools_r25.2.3 always picks the latest build-tools
          # and calls 'dx' -> 'Cannot run program .../build-tools/37.0.0/dx'.
          # Remove every build-tools version except 25.0.0 so Ant is forced
          # to use the legacy one that still ships dx.
          for d in $ANDROID_HOME/build-tools/*/; do
            ver=$(basename "$d")
            if [ "$ver" != "25.0.0" ]; then
              echo "Removing build-tools/$ver (keep only 25.0.0 for dx)"
              rm -rf "$d"
            fi
          done
          ls $ANDROID_HOME/build-tools/

      - name: Setup Java 8 (for Ant 1.9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Apache Ant 1.9.16
        run: |
          cd $HOME
          # Try multiple mirrors with retries. archive.apache.org is the
          # canonical source but can be slow/flaky; the dlcdn.apache.org
          # mirror is faster. Falls back to a Maven Central copy if both
          # fail. wget --tries=3 --retry-connrefused handles transient
          # network errors.
          ANT_URLS=(
            "https://dlcdn.apache.org/ant/binaries/apache-ant-1.9.16-bin.tar.gz"
            "https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.16-bin.tar.gz"
            "https://downloads.apache.org/ant/binaries/apache-ant-1.9.16-bin.tar.gz"
          )
          for url in "${ANT_URLS[@]}"; do
            echo "Trying: $url"
            if wget --tries=3 --retry-connrefused --waitretry=5 -q "$url" -O apache-ant-1.9.16-bin.tar.gz; then
              echo "Downloaded from: $url"
              break
            fi
            echo "Failed: $url"
          done
          if [ ! -s apache-ant-1.9.16-bin.tar.gz ]; then
            echo "::error::Failed to download Apache Ant from any mirror"
            exit 1
          fi
          tar xzf apache-ant-1.9.16-bin.tar.gz
          echo "$HOME/apache-ant-1.9.16/bin" >> "$GITHUB_PATH"
          echo "ANT_HOME=$HOME/apache-ant-1.9.16" >> "$GITHUB_ENV"
          ant -version

      - name: Stage prebuilt libgame.so into proj.android/libs
        run: |
          # The original libgame.so from Geometry Dash 1.0 APK lives in
          # lib/armeabi/. Ant expects native libraries under
          # proj.android/libs/<abi>/ so we copy it there.
          mkdir -p proj.android/libs/armeabi
          cp lib/armeabi/libgame.so proj.android/libs/armeabi/libgame.so
          ls -la proj.android/libs/armeabi/

      - name: Stage Resources into proj.android/assets
        run: |
          # v0.7 CRITICAL FIX: Ant packages every file under
          # proj.android/assets/ into the final APK's assets/ folder,
          # which is where cocos2d-x 2.2.3 CCFileUtilsAndroid looks
          # for files at runtime (it calls AAssetManager_open on
          # "GJ_GameSheet.plist", "bigFont.fnt", "HieuLouis.mp3", etc.).
          #
          # Without this step the APK ships only ~2 MB of code + libgame.so
          # and ZERO game assets -> the game crashes immediately on launch
          # when AppDelegate::applicationDidFinishLaunching() tries to
          # CCSpriteFrameCache::addSpriteFramesWithFile("GJ_GameSheet.plist").
          #
          # We copy the entire Resources/ tree (sprite sheets, .fnt fonts,
          # .mp3 music, .plist animations) verbatim. We also re-run the
          # copy with --update to skip already-up-to-date files on retries.
          mkdir -p proj.android/assets
          cp -r Resources/. proj.android/assets/
          echo "=== proj.android/assets size ==="
          du -sh proj.android/assets
          echo "=== file count ==="
          find proj.android/assets -type f | wc -l
          echo "=== first 20 files ==="
          find proj.android/assets -type f | head -20

      - name: Write local.properties (sdk.dir + ndk.dir)
        run: |
          cd proj.android
          # ANDROID_HOME is set by android-actions/setup-android@v3
          echo "sdk.dir=$ANDROID_HOME"  >  local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          # Also write to ant.properties so build.xml finds it via the
          # <property file="ant.properties" /> line.
          echo "sdk.dir=$ANDROID_HOME"  >> ant.properties
          cat local.properties
          cat ant.properties

      - name: Build APK via Ant (debug-signed for sideloading)
        run: |
          cd proj.android
          ant debug
          APK=$(find bin -name "*-debug.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Ant did not produce a debug APK"
            find bin -type f 2>/dev/null
            exit 1
          fi
          echo "Built APK: $APK"
          cp "$APK" $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-android.apk
          ls -la $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-android.apk

      - name: Verify APK contents (libgame.so + assets bundle)
        run: |
          # v0.7 SAFETY CHECK: the previous "successful" build shipped a
          # 2 MB APK that crashed on launch because it had ZERO game assets
          # (only libgame.so + classes.dex). Verify the APK actually
          # contains the critical resource files before we upload it.
          APK=$GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-android.apk
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK size: $APK_SIZE bytes ($((APK_SIZE / 1024 / 1024)) MB)"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::APK is only $((APK_SIZE / 1024 / 1024)) MB - too small. Resources are missing."
            exit 1
          fi
          echo "=== APK top-level contents ==="
          unzip -l "$APK" | head -30
          echo "=== Verifying critical assets exist inside the APK ==="
          for f in assets/GJ_GameSheet.plist assets/GJ_GameSheet.png \
                   assets/bigFont.fnt assets/bigFont.png \
                   assets/GJ_gradientBG.png assets/HieuLouis.mp3 \
                   lib/armeabi/libgame.so; do
            if unzip -l "$APK" "$f" 2>/dev/null | grep -q "$f"; then
              echo "  OK   $f"
            else
              echo "::error::MISSING from APK: $f"
              exit 1
            fi
          done
          echo "=== APK contents look correct ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HieuDash-android
          path: HieuDash-v${{ env.HIUE_DASH_VERSION }}-android.apk
          retention-days: 30

      - name: Attach to GitHub release
        if: needs.prepare.outputs.upload_url != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: HieuDash-v${{ env.HIUE_DASH_VERSION }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  #  iOS .ipa build via xcodegen + xcodebuild.
  #
  #  macOS runners are slow and the cocos2d-x 2.2.3 source tree is large
  #  (~1500 .cpp files). We use ccache to dramatically speed up rebuilds.
  # ===========================================================================
  build-ios:
    name: Build iOS .ipa
    needs: prepare
    runs-on: macos-13
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 14.3
        run: sudo xcode-select -switch /Applications/Xcode_14.3.app

      - name: Install xcodegen + ccache
        run: |
          brew install xcodegen ccache
          ccache --version

      - name: Download cocos2d-x 2.2.3
        run: |
          cd $HOME
          curl -sL ${COCOS_ZIP_URL} -o cocos2d-x-2.2.3.zip
          unzip -q cocos2d-x-2.2.3.zip
          rsync -a $HOME/${COCOS_DIR_NAME}/ $GITHUB_WORKSPACE/cocos2d/
          test -d $GITHUB_WORKSPACE/cocos2d/cocos2dx

      - name: Generate Xcode project with xcodegen
        run: |
          cd proj.ios_mac
          xcodegen generate --spec project.yml
          test -d HieuDash.xcodeproj

      - name: Build .app (unsigned, with ccache)
        run: |
          cd proj.ios_mac
          # Enable ccache by overriding CC/CXX via the Xcode build settings.
          # The CLANG_ENABLE_MODULE_DEBUGGING setting is needed because some
          # cocos2d-x 2.2.3 headers use modules that don't verify cleanly.
          export CCACHE_DIR=$HOME/.ccache
          mkdir -p $CCACHE_DIR
          ccache -M 2G || true
          xcodebuild \
            -project HieuDash.xcodeproj \
            -scheme HieuDash-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            CC="ccache clang" \
            CXX="ccache clang++" \
            build

      - name: Package .app into .ipa
        run: |
          cd proj.ios_mac
          APP=$(find build -name "HieuDash.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No HieuDash.app found"
            find build -type d 2>/dev/null
            exit 1
          fi
          echo "App: $APP"
          # v0.7 SAFETY CHECK: verify the .app bundle actually contains
          # the Resources tree (xcodegen `type: folder` should have
          # produced a "Copy Bundle Resources" phase that copies every
          # file from Resources/ into the .app). Without these the game
          # would crash on launch exactly like the Android 2MB-APK bug.
          echo "=== .app contents (top 30) ==="
          ls "$APP" | head -30
          for f in GJ_GameSheet.plist GJ_GameSheet.png \
                   bigFont.fnt bigFont.png \
                   GJ_gradientBG.png HieuLouis.mp3; do
            if [ -e "$APP/$f" ]; then
              echo "  OK   $f"
            else
              echo "::error::MISSING from .app bundle: $f"
              echo "Hint: xcodegen 'sources: - path: ../Resources  type: folder' did not copy the file."
              exit 1
            fi
          done
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-ios.ipa Payload
          ls -la $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HieuDash-ios
          path: HieuDash-v${{ env.HIUE_DASH_VERSION }}-ios.ipa
          retention-days: 30

      - name: Attach to GitHub release
        if: needs.prepare.outputs.upload_url != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: HieuDash-v${{ env.HIUE_DASH_VERSION }}-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  #  Windows .zip build via CMake + MSVC + vcpkg.
  #
  #  Pinned to windows-2022 because windows-latest now points to Windows
  #  Server 2025 with Visual Studio 18 (2026 Preview), which does NOT ship
  #  the "Visual Studio 17 2022" generator that this build uses. windows-2022
  #  still has VS 2022 (MSVC v143) installed.
  # ===========================================================================
  build-windows:
    name: Build Windows .zip
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install cocos2d-x 2.2.3
        shell: pwsh
        run: |
          $cocosHome = $env:USERPROFILE
          Invoke-WebRequest -Uri $env:COCOS_ZIP_URL -OutFile cocos2d-x-2.2.3.zip
          Expand-Archive cocos2d-x-2.2.3.zip -DestinationPath $cocosHome
          $src = "$cocosHome/$env:COCOS_DIR_NAME"
          $dst = "$env:GITHUB_WORKSPACE/cocos2d"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$src/*" -Destination $dst -Recurse -Force
          Test-Path "$dst/cocos2dx"

      - name: Patch cocos2d-x 2.2.3 for modern MSVC
        shell: pwsh
        run: |
          # v0.7: cocos2d-x 2.2.3 was written for VS2010 and has 4
          # incompatibilities with modern MSVC v143 / UCRT:
          #   1. CC_DLL is __declspec(dllimport) for .exe builds -> C2491
          #      ("definition of dllimport static data member not allowed")
          #      on every static member definition.
          #   2. CCStdC.h `#define snprintf _snprintf` -> C1189 (modern
          #      UCRT already declares snprintf as a real function).
          #   3. CCStdC.h `#define MAX max` / `#define MIN min` rely on
          #      the windows.h min/max macros, which NOMINMAX suppresses
          #      -> C3861 ('max' not found) or C2672 (std::max overload
          #      mismatch because int 0 != float).
          #   4. CCTextureCache.cpp includes <pthread.h> which doesn't
          #      exist on Windows -> C1083.
          #   5. CCImage.cpp passes wchar_t* to RemoveFontResource() which
          #      expands to the ANSI variant -> C2664.
          # The patch script is idempotent and only touches Windows-only
          # platform headers / source files; Linux/iOS/Android builds
          # use different platform files and are not affected.
          & "$env:GITHUB_WORKSPACE/scripts/patch_cocos2dx_msvc.ps1" -CocosRoot "$env:GITHUB_WORKSPACE/cocos2d"

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          # vcpkg is pre-installed on GitHub windows-latest runners at
          # C:\vcpkg. We install the static libraries cocos2d-x 2.2.3
          # needs (libpng, libjpeg, libtiff, libwebp, zlib, glew, openal).
          $vcpkg = "C:\vcpkg"
          if (-not (Test-Path $vcpkg)) {
            Write-Host "vcpkg not found at C:\vcpkg, skipping"
            return
          }
          & "$vcpkg/vcpkg.exe" install `
            --triplet x64-windows `
            libpng libjpeg-turbo tiff libwebp zlib glew openal-soft
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::vcpkg install had failures, continuing"
          }
          & "$vcpkg/vcpkg.exe" integrate install

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgToolchain = "C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::CMake configure failed"
            exit 1
          }

      - name: Build HieuDash.exe
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed"
            exit 1
          }
          $exe = Get-ChildItem -Path build/bin -Filter "HieuDash.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::HieuDash.exe not found in build output"
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Package .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path HieuDash-win | Out-Null
          $exe = Get-ChildItem -Path build/bin -Filter "HieuDash.exe" -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName HieuDash-win/HieuDash.exe
          # Copy the DLLs that vcpkg installed (runtime deps)
          Get-ChildItem -Path build -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName HieuDash-win/ -ErrorAction SilentlyContinue
          }
          # Copy Resources so the game can find textures, fonts, audio
          Copy-Item -Recurse Resources HieuDash-win/Resources
          # v0.7 SAFETY CHECK: verify the Resources copy actually happened
          # (CMakeLists.txt also does this via add_custom_command POST_BUILD,
          # but we double-check here so a broken .zip is never uploaded).
          foreach ($f in @("GJ_GameSheet.plist","GJ_GameSheet.png",
                            "bigFont.fnt","bigFont.png",
                            "GJ_gradientBG.png","HieuLouis.mp3")) {
            if (-not (Test-Path "HieuDash-win/Resources/$f")) {
              Write-Host "::error::MISSING from HieuDash-win/Resources: $f"
              exit 1
            }
            Write-Host "  OK   Resources/$f"
          }
          Compress-Archive -Path HieuDash-win/* -DestinationPath HieuDash-v$env:HIUE_DASH_VERSION-windows.zip
          Get-ChildItem HieuDash-v$env:HIUE_DASH_VERSION-windows.zip
          # Sanity check: the zip must be > 5 MB (Resources alone are ~19 MB).
          $zipSize = (Get-Item HieuDash-v$env:HIUE_DASH_VERSION-windows.zip).Length
          Write-Host "Zip size: $zipSize bytes ($([math]::Floor($zipSize / 1MB)) MB)"
          if ($zipSize -lt 5MB) {
            Write-Host "::error::Windows .zip is only $([math]::Floor($zipSize / 1MB)) MB - Resources missing"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HieuDash-windows
          path: HieuDash-v${{ env.HIUE_DASH_VERSION }}-windows.zip
          retention-days: 30

      - name: Attach to GitHub release
        if: needs.prepare.outputs.upload_url != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: HieuDash-v${{ env.HIUE_DASH_VERSION }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  #  Linux .tar.gz build via CMake + gcc + apt.
  # ===========================================================================
  build-linux:
    name: Build Linux .tar.gz
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config build-essential \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev \
            libxmu-dev libxkbfile-dev libglu1-mesa-dev \
            libfreetype-dev libfontconfig1-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            libglew-dev \
            libpulse-dev libasound2-dev libsndfile1-dev \
            libopenal-dev libalut-dev \
            libvorbis-dev libogg-dev \
            libcurl4-gnutls-dev libzip-dev zlib1g-dev \
            libwebsockets-dev

      - name: Build GLFW 2.7.9 from source (cocos2d-x 2.2.3 uses GLFW 2.x API)
        run: |
          # cocos2d-x 2.2.3's Linux platform code (CCEGLView.cpp) uses the
          # GLFW 2.x API (glfwOpenWindow, glfwGetMousePos, etc.) which was
          # removed in GLFW 3.x. Ubuntu 24.04 only ships GLFW 3.x, so we
          # build GLFW 2.7.9 from source and install it to /usr/local.
          # NOTE: the modern github.com/glfw/glfw repo deleted the 2.x tags,
          # so we use the SourceForge archive which still hosts 2.7.9.
          cd /tmp
          curl -sL -o glfw-2.7.9.tar.gz \
            "https://sourceforge.net/projects/glfw/files/glfw/2.7.9/glfw-2.7.9.tar.gz/download"
          tar xzf glfw-2.7.9.tar.gz
          cd glfw-2.7.9
          make x11
          sudo make x11-install PREFIX=/usr/local
          # Verify the install.
          test -f /usr/local/include/GL/glfw.h
          test -f /usr/local/lib/libglfw.a || test -f /usr/local/lib64/libglfw.a
          ls /usr/local/include/GL/glfw.h
          ls /usr/local/lib/libglfw.a 2>/dev/null || ls /usr/local/lib64/libglfw.a

      - name: Install cocos2d-x 2.2.3
        run: |
          cd $HOME
          wget -q ${COCOS_ZIP_URL}
          unzip -q cocos2d-x-2.2.3.zip
          rsync -a $HOME/${COCOS_DIR_NAME}/ $GITHUB_WORKSPACE/cocos2d/
          test -d $GITHUB_WORKSPACE/cocos2d/cocos2dx

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          if [ $? -ne 0 ]; then
            echo "::error::CMake configure failed"
            exit 1
          fi

      - name: Build HieuDash
        run: |
          cmake --build build --parallel
          if [ $? -ne 0 ]; then
            echo "::error::Build failed"
            exit 1
          fi
          BIN=$(find build/bin -name "HieuDash" -type f -executable | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::HieuDash binary not found"
            find build -type f -executable
            exit 1
          fi
          echo "Built: $BIN"

      - name: Package .tar.gz
        run: |
          STAGING=$GITHUB_WORKSPACE/HieuDash-linux
          mkdir -p "$STAGING/bin" "$STAGING/Resources" "$STAGING/lib"
          BIN=$(find build/bin -name "HieuDash" -type f -executable | head -1)
          cp "$BIN" "$STAGING/bin/HieuDash"
          cp -r Resources/* "$STAGING/Resources/"
          # Bundle any cocos2d-x runtime .so dependencies built alongside
          find build -name "*.so" -type f -exec cp {} "$STAGING/lib/" \; 2>/dev/null || true
          # v0.7 SAFETY CHECK: verify Resources are actually present.
          for f in GJ_GameSheet.plist GJ_GameSheet.png \
                   bigFont.fnt bigFont.png \
                   GJ_gradientBG.png HieuLouis.mp3; do
            if [ -e "$STAGING/Resources/$f" ]; then
              echo "  OK   Resources/$f"
            else
              echo "::error::MISSING from HieuDash-linux/Resources: $f"
              exit 1
            fi
          done
          tar czf $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-linux.tar.gz \
            -C $GITHUB_WORKSPACE HieuDash-linux
          ls -la $GITHUB_WORKSPACE/HieuDash-v${HIUE_DASH_VERSION}-linux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HieuDash-linux
          path: HieuDash-v${{ env.HIUE_DASH_VERSION }}-linux.tar.gz
          retention-days: 30

      - name: Attach to GitHub release
        if: needs.prepare.outputs.upload_url != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: HieuDash-v${{ env.HIUE_DASH_VERSION }}-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
