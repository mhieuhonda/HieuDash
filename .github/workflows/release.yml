name: Build & Release

# Workflow nay chay moi khi tao release moi (published).
# 3 luong song song: Android APK, Linux, Windows.
# Build xong, moi luong upload artifact vao release vua tao.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (for manual run)"
        required: false
        default: "v0.4.0"

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  GODOT_VERSION: "4.7"
  GODOT_VERSION_FULL: "4.7-stable"
  PROJECT_NAME: "HieuDash"

jobs:
  # ============================================================
  # JOB 1: Build Android APK
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Tim sdkmanager binary (co the o latest hoac 16.0).
          SDKMGR=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMGR"
          # Accept licenses truoc.
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # Install required packages (semicolons phai duoc quote).
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          # Verify.
          "$SDKMGR" --list_installed | grep -E "platforms|build-tools" || true

      - name: Generate release keystore for APK signing
        env:
          HIEUDASH_KEYSTORE_PASS: ${{ secrets.HIEUDASH_KEYSTORE_PASS }}
        run: |
          set -e
          echo "=== Generating keystore for signing APK ==="
          # Neu co secret HIEUDASH_KEYSTORE_PASS thi dung; nguoc lai dung default.
          KS_PASS="${HIEUDASH_KEYSTORE_PASS:-hieudash_release_2026}"
          KS_PATH="$HOME/hieudash.keystore"
          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias hieudash \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hieu Dash, OU=Project, O=mhieuhonda, L=Hanoi, ST=Hanoi, C=VN"
          echo "Keystore created at: $KS_PATH"
          ls -la "$KS_PATH"
          # Luu path va password vao env file cho step sau.
          echo "HIEUDASH_KEYSTORE_PATH=$KS_PATH" >> $GITHUB_ENV
          echo "HIEUDASH_KEYSTORE_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "HIEUDASH_KEYSTORE_ALIAS=hieudash" >> $GITHUB_ENV

      - name: Configure Godot Android signing
        run: |
          set -e
          echo "=== Patching export_presets.cfg with keystore path ==="
          # Them keystore/release_path, user, password vao export_presets.cfg (preset.0 = Android).
          python3 - <<'PY'
          import os
          path = "export_presets.cfg"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          ks_path = os.environ.get("HIEUDASH_KEYSTORE_PATH", "")
          ks_pass = os.environ.get("HIEUDASH_KEYSTORE_PASS", "")
          ks_alias = os.environ.get("HIEUDASH_KEYSTORE_ALIAS", "hieudash")
          additions = f'''
keystore/release="{ks_path}"
keystore/release_user="{ks_alias}"
keystore/release_password="{ks_pass}"
'''
          if 'keystore/release' not in content:
              # Chen sau dong package/signed=true
              marker = 'package/signed=true'
              if marker in content:
                  content = content.replace(marker, marker + additions, 1)
              else:
                  # Chen vao cuoi preset.0.options
                  content = content.replace('graphics/32_bits_display=true',
                                            'graphics/32_bits_display=true' + additions, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Patched export_presets.cfg with keystore config")
          # In ra de verify
          import re
          for line in content.splitlines():
              if 'keystore' in line.lower() or 'package/signed' in line:
                  print("  ", line)
          PY

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          # Dung gh CLI de download (co auth, khong bi rate-limit).
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
          ls -la godot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -30 || true

      - name: Export Android APK
        run: |
          set -e
          echo "=== Running Godot Android export ==="
          godot --headless --export-release "Android" --quiet 2>&1 | tee export_android.log || true
          echo "=== Searching for built APK ==="
          find . -name "*.apk" -type f 2>/dev/null | head -10
          mkdir -p export/android
          found_apk=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$found_apk" ]; then
            cp "$found_apk" export/android/HieuDash.apk
            echo "Copied APK from: $found_apk"
          else
            echo "ERROR: No APK built! Check export_android.log above."
            cat export_android.log
            exit 1
          fi
          ls -la export/android/

      - name: Rename APK with version
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.4.0' }}"
          fi
          mkdir -p artifacts
          cp export/android/HieuDash.apk "artifacts/HieuDash-${TAG}-android.apk"
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.4.0' }}
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2: Build Linux
  # ============================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -30 || true

      - name: Export Linux build
        run: |
          set -e
          mkdir -p export/linux
          echo "=== Running Godot Linux export ==="
          godot --headless --export-release "Linux" --quiet 2>&1 | tee export_linux.log || true
          ls -la export/linux/
          if [ ! -f export/linux/HieuDash.x86_64 ]; then
            echo "ERROR: Linux binary not found!"
            cat export_linux.log
            exit 1
          fi
          chmod +x export/linux/HieuDash.x86_64

      - name: Package Linux build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.4.0' }}"
          fi
          mkdir -p artifacts
          cd export/linux
          zip -r "../../artifacts/HieuDash-${TAG}-linux-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Linux build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.4.0' }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3: Build Windows
  # ============================================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -30 || true

      - name: Export Windows build
        run: |
          set -e
          mkdir -p export/windows
          echo "=== Running Godot Windows export ==="
          godot --headless --export-release "Windows Desktop" --quiet 2>&1 | tee export_windows.log || true
          ls -la export/windows/
          if [ ! -f export/windows/HieuDash.exe ]; then
            echo "ERROR: Windows binary not found!"
            cat export_windows.log
            exit 1
          fi

      - name: Package Windows build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.4.0' }}"
          fi
          mkdir -p artifacts
          cd export/windows
          zip -r "../../artifacts/HieuDash-${TAG}-windows-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.4.0' }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
