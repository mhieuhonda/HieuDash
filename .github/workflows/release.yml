name: Build & Release

# Workflow nay chay moi khi tao release moi (published).
# 3 luong song song: Android APK, Linux, Windows.
# Build xong, moi luong upload artifact vao release vua tao.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (for manual run)"
        required: false
        default: "v0.5.0"

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  GODOT_VERSION: "4.7"
  GODOT_VERSION_FULL: "4.7-stable"
  PROJECT_NAME: "HieuDash"
  # Stable release-signing keystore (committed in repo at keystore/hieudash.keystore)
  # Using a committed keystore ensures APKs are signed consistently across CI builds
  # and local builds. Without this, every CI run signs with a fresh cert and
  # Google Play Protect warns "package seems corrupted" on install.
  HIEUDASH_KEYSTORE_PASS: "hieudash_release_2026"

jobs:
  # ============================================================
  # JOB 1: Build Android APK
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Tim sdkmanager binary (co the o latest hoac 16.0).
          SDKMGR=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMGR"
          # Accept licenses truoc.
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # Install required packages (semicolons phai duoc quote).
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # Verify.
          "$SDKMGR" --list_installed | grep -E "platforms|build-tools" || true

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
          ls -la godot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Godot editor settings (Android SDK + Java SDK paths)
        run: |
          set -e
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.7.tres"
          mkdir -p "$HOME/.config/godot"
          # Start Godot once to generate the settings file.
          ./godot --headless --quit > /dev/null 2>&1 || true
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "ERROR: Godot settings file not generated."
            exit 1
          fi
          # Patch the Android SDK + Java SDK paths.
          sed -i "s|export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS_FILE"
          sed -i "s|export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|" "$SETTINGS_FILE"
          echo "=== Updated settings ==="
          grep -E "export/android/(java|android)_sdk_path" "$SETTINGS_FILE"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          ./godot --headless --import --quiet 2>&1 | tail -30

      - name: Export Android APK (with gradle build)
        run: |
          set -e
          mkdir -p export/android
          echo "=== Running Godot Android export (with --install-android-build-template) ==="
          # --install-android-build-template ensures the gradle template is properly
          # installed (creates .build_version marker + extracts android_source.zip).
          # Without this, Godot errors with "Android build template not installed" or
          # "no version info for it exists".
          ./godot --headless --install-android-build-template --export-release "Android" 2>&1 | tee export_android.log
          echo "=== Searching for built APK ==="
          find . -name "*.apk" -type f 2>/dev/null | head -10
          found_apk=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$found_apk" ]; then
            cp "$found_apk" export/android/HieuDash.apk
            echo "Copied APK from: $found_apk"
          else
            echo "ERROR: No APK built! Check export_android.log above."
            cat export_android.log
            exit 1
          fi
          ls -la export/android/

      - name: Verify APK is signed (not corrupted)
        run: |
          set -e
          APK="export/android/HieuDash.apk"
          echo "=== Verifying APK signature ==="
          # Use apksigner to verify the APK is properly signed.
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" || {
            echo "ERROR: APK signature verification failed!"
            echo "This means the APK is unsigned or signed with an invalid cert."
            echo "Google Play Protect will warn 'package seems corrupted'."
            exit 1
          }
          echo "=== APK signature OK ==="
          echo "=== APK info ==="
          # Print APK basic info to confirm name and version
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | head -1)
          "$AAPT2" dump badging "$APK" 2>/dev/null | grep -E "package:|application-label:|launchable-activity:" | head -5

      - name: Rename APK with version
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.5.0' }}"
          fi
          mkdir -p artifacts
          cp export/android/HieuDash.apk "artifacts/HieuDash-${TAG}-android.apk"
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5.0' }}
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2: Build Linux
  # ============================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          ./godot --headless --import --quiet 2>&1 | tail -30

      - name: Export Linux build
        run: |
          set -e
          mkdir -p export/linux
          echo "=== Running Godot Linux export ==="
          ./godot --headless --export-release "Linux" 2>&1 | tee export_linux.log
          ls -la export/linux/
          if [ ! -f export/linux/HieuDash.x86_64 ]; then
            echo "ERROR: Linux binary not found!"
            cat export_linux.log
            exit 1
          fi
          chmod +x export/linux/HieuDash.x86_64

      - name: Package Linux build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.5.0' }}"
          fi
          mkdir -p artifacts
          cd export/linux
          zip -r "../../artifacts/HieuDash-${TAG}-linux-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Linux build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5.0' }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3: Build Windows
  # ============================================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine and export templates
        run: |
          set -e
          echo "=== Downloading Godot $GODOT_VERSION_FULL engine + templates via gh CLI ==="
          gh release download "$GODOT_VERSION_FULL" \
            --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip" \
            --pattern "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" \
            --dir .
          echo "=== Extracting engine ==="
          unzip -q "Godot_v${GODOT_VERSION_FULL}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION_FULL}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION_FULL}_linux.x86_64" godot
          echo "$PWD" >> $GITHUB_PATH
          echo "=== Extracting export templates ==="
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION_FULL}_export_templates.tpz" -d tmp_tpl
          cp tmp_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "=== Done ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          ./godot --headless --import --quiet 2>&1 | tail -30

      - name: Export Windows build
        run: |
          set -e
          mkdir -p export/windows
          echo "=== Running Godot Windows export ==="
          ./godot --headless --export-release "Windows Desktop" 2>&1 | tee export_windows.log
          ls -la export/windows/
          if [ ! -f export/windows/HieuDash.exe ]; then
            echo "ERROR: Windows binary not found!"
            cat export_windows.log
            exit 1
          fi

      - name: Package Windows build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.5.0' }}"
          fi
          mkdir -p artifacts
          cd export/windows
          zip -r "../../artifacts/HieuDash-${TAG}-windows-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5.0' }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
