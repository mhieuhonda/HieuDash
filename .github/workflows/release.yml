name: Build & Release

# Workflow nay chay moi khi tao release moi (published).
# 3 luong song song: Android APK, Linux, Windows.
# Build xong, moi luong upload artifact vao release vua tao.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (for manual run)"
        required: false
        default: "v0.2.0"

# Huy build cu neu push moi (tranh lang phi).
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_VERSION_FULL: "4.7-stable"
  # Ten goi ngan cho artifact names.
  PROJECT_NAME: "HieuDash"

jobs:
  # ============================================================
  # JOB 1: Build Android APK
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Install Godot engine
        run: |
          set -e
          echo "Downloading Godot $GODOT_VERSION_FULL for Linux..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v*$GODOT_VERSION_FULL_linux.x86_64
          mv Godot_v*$GODOT_VERSION_FULL_linux.x86_64 godot
          echo "$PWD" >> $GITHUB_PATH

      - name: Download Godot export templates
        run: |
          set -e
          echo "Downloading export templates for $GODOT_VERSION_FULL..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_export_templates.tpz -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable
          unzip -q templates.tpz -d tmp_tpl
          cp tmp_tpl/templates/* $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -20 || true

      - name: Export Android APK
        run: |
          set -e
          echo "=== Running Godot Android export ==="
          godot --headless --export-release "Android" --quiet 2>&1 | tee export_android.log || true
          echo "=== Searching for built APK ==="
          find . -name "*.apk" -type f 2>/dev/null | head -10
          # With gradle build, APK is typically at android/build/build/outputs/apk/debug/
          mkdir -p export/android
          found_apk=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$found_apk" ]; then
            cp "$found_apk" export/android/HieuDash.apk
            echo "Copied APK from: $found_apk"
          else
            echo "ERROR: No APK built! Check export_android.log above."
            cat export_android.log
            exit 1
          fi
          ls -la export/android/

      - name: Rename APK with version
        run: |
          TAG="${GITHUB_REF##*/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/tags" ]; then
            TAG="${{ github.event.inputs.tag || 'v0.2.0' }}"
          fi
          mkdir -p artifacts
          if [ -f export/android/HieuDash.apk ]; then
            cp export/android/HieuDash.apk "artifacts/HieuDash-${TAG}-android.apk"
          else
            echo "WARNING: APK not found at expected path, searching..."
            found=$(find . -name "*.apk" -type f | head -1)
            if [ -n "$found" ]; then
              cp "$found" "artifacts/HieuDash-${TAG}-android.apk"
            else
              echo "ERROR: No APK built!"
              exit 1
            fi
          fi
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2: Build Linux
  # ============================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine
        run: |
          set -e
          echo "Downloading Godot $GODOT_VERSION_FULL for Linux..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v*$GODOT_VERSION_FULL_linux.x86_64
          mv Godot_v*$GODOT_VERSION_FULL_linux.x86_64 godot
          echo "$PWD" >> $GITHUB_PATH

      - name: Download Godot export templates
        run: |
          set -e
          echo "Downloading export templates for $GODOT_VERSION_FULL..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_export_templates.tpz -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable
          unzip -q templates.tpz -d tmp_tpl
          cp tmp_tpl/templates/* $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -20 || true

      - name: Export Linux build
        run: |
          set -e
          mkdir -p export/linux
          godot --headless --export-release "Linux" --quiet 2>&1 | tee export_linux.log || true
          ls -la export/linux/

      - name: Package Linux build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/tags" ]; then
            TAG="${{ github.event.inputs.tag || 'v0.2.0' }}"
          fi
          mkdir -p artifacts
          cd export/linux
          # Tao zip chua binary + .pck (neu co) + dependencies
          zip -r "../../artifacts/HieuDash-${TAG}-linux-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Linux build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3: Build Windows
  # ============================================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot engine
        run: |
          set -e
          echo "Downloading Godot $GODOT_VERSION_FULL for Linux..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v*$GODOT_VERSION_FULL_linux.x86_64
          mv Godot_v*$GODOT_VERSION_FULL_linux.x86_64 godot
          echo "$PWD" >> $GITHUB_PATH

      - name: Download Godot export templates
        run: |
          set -e
          echo "Downloading export templates for $GODOT_VERSION_FULL..."
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION_FULL/Godot_v$GODOT_VERSION_FULL_export_templates.tpz -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable
          unzip -q templates.tpz -d tmp_tpl
          cp tmp_tpl/templates/* $HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/

      - name: Import project resources (headless)
        run: |
          echo "Importing project (this may take a while)..."
          godot --headless --import --quiet 2>&1 | tail -20 || true

      - name: Export Windows build
        run: |
          set -e
          mkdir -p export/windows
          godot --headless --export-release "Windows Desktop" --quiet 2>&1 | tee export_windows.log || true
          ls -la export/windows/

      - name: Package Windows build
        run: |
          TAG="${GITHUB_REF##*/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/tags" ]; then
            TAG="${{ github.event.inputs.tag || 'v0.2.0' }}"
          fi
          mkdir -p artifacts
          cd export/windows
          zip -r "../../artifacts/HieuDash-${TAG}-windows-x86_64.zip" . -x "*.import"
          cd ../..
          ls -la artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/*.zip
          retention-days: 14

      - name: Upload Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
