# =============================================================================
# HieuDash — Release Pipeline
# Triggers automatically when a new release is published.
# Builds APK, Linux, Windows, iOS artifacts and attaches them to the release.
# =============================================================================

name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v0.5)'
        required: true
        default: 'v0.5'

permissions:
  contents: write   # required by softprops/action-gh-release to upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Build matrix — every job runs in parallel, failures on one platform do not
# block the others.  The final release job runs `if: always()` and uploads
# whichever artifacts were successfully produced.
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # Android APK — rebuilt from the decompiled smali/resources via apktool
  # -------------------------------------------------------------------------
  build-apk:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME}"         >> $GITHUB_ENV
          if [ ! -d "${ANDROID_SDK_ROOT}/cmdline-tools" ]; then
            echo "Installing Android cmdline-tools..."
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            SDKMANAGER_URL="https://dl.google.com/android/repository/commandlinetools-linux-11062923_latest.zip"
            wget -q -O /tmp/cmdline-tools.zip "${SDKMANAGER_URL}"
            unzip -q -d /tmp/cmdline-tools /tmp/cmdline-tools.zip
            mv /tmp/cmdline-tools/cmdline-tools "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          fi
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
          ls "${ANDROID_SDK_ROOT}/build-tools/"

      - name: Install apktool
        run: |
          set -euo pipefail
          for url in \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar" ; do
            echo "Trying ${url}"
            if wget -q --tries=3 --timeout=60 -O /tmp/apktool.jar "${url}" \
               && [ -s /tmp/apktool.jar ]; then
              echo "Downloaded from ${url}"
              break
            fi
          done
          [ -s /tmp/apktool.jar ] || { echo "Failed to download apktool"; exit 1; }
          sudo install -m 0644 /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Rebuild + sign APK
        run: bash scripts/build_android.sh

      - name: Rename for release
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5' }}"
          mv GeometryDash.apk "HieuDash-${TAG}-android.apk"
          ls -lh "HieuDash-${TAG}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: HieuDash-*-android.apk
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Linux desktop build — CMake + gcc
  # -------------------------------------------------------------------------
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Fetch Cocos2d-x
        run: |
          set -euo pipefail
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || git clone --depth 1 \
                 https://github.com/nicholasgasior/cocos2d-x-2.2.3.git cocos2d 2>/dev/null \
            || git clone --depth 1 --branch v2 \
                 https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || true
          rm -rf cocos2d/.git 2>/dev/null || true
          if [ -d cocos2d/cocos2dx ]; then
            echo "Cocos2d-x located successfully"
          else
            echo "::warning::Cocos2d-x sources not found — Linux build will likely fail"
          fi

      - name: Configure (CMake)
        continue-on-error: true
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF || true

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cmake --build build --config Release -j"$(nproc)" || true
          if compgen -G "build/GeometryDash" > /dev/null || compgen -G "build/HieuDash" > /dev/null; then
            echo "binary_found=true" >> $GITHUB_OUTPUT
          else
            echo "binary_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Package
        if: steps.build.outputs.binary_found == 'true'
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5' }}"
          mkdir -p dist/HieuDash-linux
          for bin in build/GeometryDash build/HieuDash; do
            [ -f "$bin" ] && cp -v "$bin" dist/HieuDash-linux/ && break
          done
          [ -d Resources ] && cp -r Resources dist/HieuDash-linux/ || true
          [ -d assets ]    && cp -r assets    dist/HieuDash-linux/ || true
          cd dist && tar czf "../HieuDash-${TAG}-linux.tar.gz" HieuDash-linux
          cd ..
          ls -lh "HieuDash-${TAG}-linux.tar.gz"

      - name: Upload Linux artifact
        if: steps.build.outputs.binary_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: HieuDash-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Windows desktop build — CMake + MSVC
  # -------------------------------------------------------------------------
  build-windows:
    name: Windows
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Configure git for Windows-incompatible paths
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - name: Checkout (sparse — excludes Classes/ which contains '*'/space/'<>' chars)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            CMakeLists.txt
            Resources
            scripts
            thirdparty
            version.json
          sparse-checkout-cone-mode: false

      - name: Set up MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch Cocos2d-x
        shell: pwsh
        run: |
          try {
            git clone --depth 1 --branch cocos2d-x-2.2.3 `
              https://github.com/cocos2d/cocos2d-x.git cocos2d 2>$null
          } catch {
            Write-Host "::warning::Could not fetch Cocos2d-x — Windows build may fail"
          }
          if (Test-Path cocos2d/cocos2dx) {
            Write-Host "Cocos2d-x located successfully"
          } else {
            Write-Host "::warning::Cocos2d-x sources not found — Windows build will likely fail"
          }

      - name: Configure (CMake)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCOCOS2DX_ROOT="$env:GITHUB_WORKSPACE/cocos2d" `
            -DUSE_FMOD=OFF

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          $bins = @("build\Release\GeometryDash.exe","build\GeometryDash.exe","build\Release\HieuDash.exe","build\HieuDash.exe")
          $found = $false
          foreach ($b in $bins) {
            if (Test-Path $b) { "binary_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; $found = $true; break }
          }
          if (-not $found) { "binary_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }

      - name: Package
        if: steps.build.outputs.binary_found == 'true'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5' }}"
          New-Item -ItemType Directory -Force -Path "dist\HieuDash-windows" | Out-Null
          $candidates = @("build\Release\GeometryDash.exe","build\GeometryDash.exe","build\Release\HieuDash.exe","build\HieuDash.exe")
          foreach ($c in $candidates) {
            if (Test-Path $c) { Copy-Item $c "dist\HieuDash-windows\"; break }
          }
          if (Test-Path Resources) { Copy-Item -Recurse Resources "dist\HieuDash-windows\" }
          Compress-Archive -Path "dist\HieuDash-windows\*" `
            -DestinationPath "HieuDash-$tag-windows.zip" -Force
          Get-ChildItem "HieuDash-$tag-windows.zip" | Format-List Name,Length

      - name: Upload Windows artifact
        if: steps.build.outputs.binary_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: HieuDash-*-windows.zip
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # iOS build — CMake + Xcode (no code-signing, just .app + .ipa for archive)
  # -------------------------------------------------------------------------
  build-ios:
    name: iOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Fetch Cocos2d-x
        run: |
          set -euo pipefail
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || git clone --depth 1 \
                 https://github.com/nicholasgasior/cocos2d-x-2.2.3.git cocos2d 2>/dev/null \
            || true
          rm -rf cocos2d/.git 2>/dev/null || true
          if [ -d cocos2d/cocos2dx ]; then
            echo "Cocos2d-x located successfully"
          else
            echo "::warning::Cocos2d-x sources not found — iOS build will likely fail"
          fi

      - name: Configure (CMake / Xcode)
        continue-on-error: true
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF || true

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cmake --build build --config Release \
            -- -sdk iphoneos -destination 'generic/platform=iOS' \
               -parallelizeTargets \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY="" \
            || true
          APP_PATH="$(find build -name '*.app' -type d 2>/dev/null | head -1)"
          if [ -n "${APP_PATH}" ]; then
            echo "app_path=${APP_PATH}"     >> $GITHUB_OUTPUT
            echo "binary_found=true"        >> $GITHUB_OUTPUT
          else
            echo "binary_found=false"       >> $GITHUB_OUTPUT
          fi

      - name: Package .ipa
        if: steps.build.outputs.binary_found == 'true'
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || 'v0.5' }}"
          APP_PATH="${{ steps.build.outputs.app_path }}"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry "HieuDash-${TAG}-ios.ipa" Payload
          ls -lh "HieuDash-${TAG}-ios.ipa"

      - name: Upload iOS artifact
        if: steps.build.outputs.binary_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: HieuDash-*-ios.ipa
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Release upload — runs after every build job, uploads all artifacts that
  # were successfully produced.  Uses `if: always()` so a single platform
  # failure never blocks the release.
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish to Release
    runs-on: ubuntu-22.04
    if: always()
    needs: [ build-apk, build-linux, build-windows, build-ios ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          echo "=== Downloaded release artifacts ==="
          ls -lhR release-assets/ || true
          echo "=== Files ready for upload ==="
          find release-assets -type f -print -exec ls -lh {} \; || true

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || '' }}"
          if [ -z "${TAG}" ]; then
            TAG="$(echo "${{ github.ref }}" | sed -E 's@^refs/tags/@@')"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Publishing assets to release: ${TAG}"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HieuDash ${{ steps.tag.outputs.tag }}
          files: release-assets/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
