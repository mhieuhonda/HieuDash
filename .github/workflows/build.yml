# =============================================================================
# GeometryDash (HieuDash) — CI / CD
# Builds the project on every push and pull request across multiple platforms.
# =============================================================================

name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -----------------------------------------------------------------------
  # Linux (desktop) build
  # -----------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libcurl4-openssl-dev libssl-dev \
            libfmodex-dev 2>/dev/null || true

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCOCOS2DX_ROOT=$GITHUB_WORKSPACE/cocos2d

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-linux-${{ matrix.build_type }}
          path: build/GeometryDash

  # -----------------------------------------------------------------------
  # Windows build
  # -----------------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCOCOS2DX_ROOT="$env:GITHUB_WORKSPACE/cocos2d"
        shell: pwsh

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-windows-${{ matrix.build_type }}
          path: build/${{ matrix.build_type }}/GeometryDash.exe

  # -----------------------------------------------------------------------
  # macOS build
  # -----------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake openssl curl

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCOCOS2DX_ROOT=$GITHUB_WORKSPACE/cocos2d

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-macos-${{ matrix.build_type }}
          path: build/GeometryDash

  # -----------------------------------------------------------------------
  # Android APK build
  # -----------------------------------------------------------------------
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Install CMake & build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk/r25.2
        run: bash scripts/build_android.sh
        working-directory: ${{ github.workspace }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-android-apk
          path: proj.android/app/build/outputs/apk/**/*.apk

  # -----------------------------------------------------------------------
  # iOS build (Xcode)
  # -----------------------------------------------------------------------
  build-ios:
    name: iOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -B build -S . \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCOCOS2DX_ROOT=$GITHUB_WORKSPACE/cocos2d

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            -- -sdk iphoneos -destination 'generic/platform=iOS' \
               -parallelizeTargets \
               -j$(sysctl -n hw.ncpu)
