# =============================================================================
# GeometryDash (HieuDash) — CI on push / pull request
# Verifies that the APK can be rebuilt and that the desktop CMake configuration
# at least configures successfully.
# =============================================================================

name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -----------------------------------------------------------------------
  # Android APK rebuild (apktool) — primary artifact, must succeed
  # -----------------------------------------------------------------------
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool & Android build-tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget unzip
          wget -q -O /tmp/apktool.jar \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar
          sudo install -m 0755 /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          ANDROID_SDK_ROOT=/usr/local/android-sdk
          sudo mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          wget -q -O /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          sudo mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" \
                 "${ANDROID_SDK_ROOT}/cmdline-tools/latest" 2>/dev/null || true
          yes | sudo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
                  --licenses > /dev/null 2>&1 || true
          sudo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
                  "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Rebuild + sign APK
        env:
          ANDROID_SDK_ROOT: /usr/local/android-sdk
          ANDROID_HOME: /usr/local/android-sdk
        run: bash scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-android-apk
          path: GeometryDash.apk

  # -----------------------------------------------------------------------
  # Linux desktop build — best-effort (Cocos2d-x 2.2.3 may fail to build
  # with modern toolchains).  continue-on-error so PRs are not blocked.
  # -----------------------------------------------------------------------
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Fetch Cocos2d-x 2.2.3
        run: |
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || true

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        run: cmake --build build --config Release -j"$(nproc)"

  # -----------------------------------------------------------------------
  # Windows desktop build — best-effort
  # -----------------------------------------------------------------------
  build-windows:
    name: Windows
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Cocos2d-x 2.2.3
        shell: pwsh
        run: |
          try {
            git clone --depth 1 --branch cocos2d-x-2.2.3 `
              https://github.com/cocos2d/cocos2d-x.git cocos2d 2>$null
          } catch { Write-Host "::warning::Could not fetch Cocos2d-x" }

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCOCOS2DX_ROOT="$env:GITHUB_WORKSPACE/cocos2d" `
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        shell: pwsh
        run: cmake --build build --config Release --parallel

  # -----------------------------------------------------------------------
  # iOS build — best-effort
  # -----------------------------------------------------------------------
  build-ios:
    name: iOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Fetch Cocos2d-x 2.2.3
        run: |
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || true

      - name: Configure
        run: |
          cmake -B build -S . -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        run: |
          cmake --build build --config Release \
            -- -sdk iphoneos -destination 'generic/platform=iOS' \
               -parallelizeTargets \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""
