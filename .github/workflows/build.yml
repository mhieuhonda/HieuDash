# =============================================================================
# GeometryDash (GeometryDash) — CI on push / pull request
# Verifies that the APK can be rebuilt and that the desktop CMake configuration
# at least configures successfully.
# =============================================================================

name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -----------------------------------------------------------------------
  # Android APK rebuild (apktool) — primary artifact, must succeed
  # -----------------------------------------------------------------------
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (manual)
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME}"         >> $GITHUB_ENV
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34"

      - name: Install apktool
        run: |
          set -euo pipefail
          for url in \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar" ; do
            echo "Trying ${url}"
            if wget -q --tries=2 --timeout=30 -O /tmp/apktool.jar "${url}" \
               && [ -s /tmp/apktool.jar ]; then
              echo "Downloaded from ${url}"
              break
            fi
          done
          [ -s /tmp/apktool.jar ] || { echo "Failed to download apktool"; exit 1; }
          sudo install -m 0644 /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Rebuild + sign APK
        run: bash scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geometrydash-android-apk
          path: GeometryDash.apk

  # -----------------------------------------------------------------------
  # Linux desktop build — best-effort (Cocos2d-x 2.2.3 may fail to build
  # with modern toolchains).  continue-on-error so PRs are not blocked.
  # -----------------------------------------------------------------------
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Fetch Cocos2d-x 2.2.3
        run: |
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || true

      - name: Configure
        continue-on-error: true
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        run: cmake --build build --config Release -j"$(nproc)"

  # -----------------------------------------------------------------------
  # Windows desktop build — best-effort
  # -----------------------------------------------------------------------
  build-windows:
    name: Windows
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Configure git for Windows-incompatible paths
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - name: Checkout (sparse — excludes Classes/ which contains '*'/space/'<>' chars)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            CMakeLists.txt
            Resources
            scripts
            thirdparty
          sparse-checkout-cone-mode: false

      - name: Fetch Cocos2d-x 2.2.3
        shell: pwsh
        run: |
          try {
            git clone --depth 1 --branch cocos2d-x-2.2.3 `
              https://github.com/cocos2d/cocos2d-x.git cocos2d 2>$null
          } catch { Write-Host "::warning::Could not fetch Cocos2d-x" }

      - name: Configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCOCOS2DX_ROOT="$env:GITHUB_WORKSPACE/cocos2d" `
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        shell: pwsh
        run: cmake --build build --config Release --parallel

  # -----------------------------------------------------------------------
  # iOS build — best-effort
  # -----------------------------------------------------------------------
  build-ios:
    name: iOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Fetch Cocos2d-x 2.2.3
        run: |
          git clone --depth 1 --branch cocos2d-x-2.2.3 \
            https://github.com/cocos2d/cocos2d-x.git cocos2d 2>/dev/null \
            || true

      - name: Configure
        continue-on-error: true
        run: |
          cmake -B build -S . -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOCOS2DX_ROOT="$GITHUB_WORKSPACE/cocos2d" \
            -DUSE_FMOD=OFF

      - name: Build
        continue-on-error: true
        run: |
          cmake --build build --config Release \
            -- -sdk iphoneos -destination 'generic/platform=iOS' \
               -parallelizeTargets \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""
