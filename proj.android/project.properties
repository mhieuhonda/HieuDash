# ============================================================
# GeometryDash — Android project properties
# ============================================================

# Compile against this Android API level
target=android-28

# Native code lives under ../Classes (Cocos2d-x convention)
# ndk-build will pick up the Android.mk / Application.mk from jni/
android.library.reference.1=../cocos2d/cocos2dx/platform/android/java

# Proguard — off by default for decompilation / debugging
proguard.config=

# Key store for release signing (override in ant.properties)
# key.store=../release.keystore
# key.alias=geometrydash
