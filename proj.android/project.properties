# project.properties - target Android API level for the Ant build.
# v0.5: raised from android-8 (dangerous: minSdkVersion 8 = Android 2.2,
# which has unpatched security holes and forces apps to use legacy
# storage paths) to android-21 (Android 5.0 Lollipop, the minimum that
# supports arm64-v8a, runtime permissions, and full-screen immersive
# mode).
target=android-21
